name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  # TODO: Load from `.swift-version` file
  SWIFT_VERSION: 6.1
  SWIFT_STATIC_SDK_URL: https://download.swift.org/swift-6.1-release/static-sdk/swift-6.1-RELEASE/swift-6.1-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz
  SWIFT_STATIC_SDK_CHECKSUM: 111c6f7d280a651208b8c74c0521dd99365d785c1976a6e23162f55f65379ac6
  TAG: ${{ github.ref_name }}

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Create release via gh
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.TAG }}" --title "${{ env.TAG }}" --generate-notes

  macos:
    name: Release macOS
    runs-on: macos-26
    needs: create_release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ env.SWIFT_VERSION }}
      - name: Build & Package
        run: make package
      - name: Upload Darwin Universal Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv release/xcbeautify.zip "xcbeautify-${{ env.TAG }}-universal-apple-macosx.zip"
          gh release upload "${{ env.TAG }}" "xcbeautify-${{ env.TAG }}-universal-apple-macosx.zip" --clobber
      - name: Store Darwin Universal Binary for Artifact Bundle
        uses: actions/upload-artifact@v4
        with:
          name: xcbeautify-macos
          path: release/xcbeautify
          if-no-files-found: error
      - name: Upload Darwin x86_64 Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv .build/x86_64-apple-macosx/release/xcbeautify.zip "xcbeautify-${{ env.TAG }}-x86_64-apple-macosx.zip"
          gh release upload "${{ env.TAG }}" "xcbeautify-${{ env.TAG }}-x86_64-apple-macosx.zip" --clobber
      - name: Upload Darwin arm64 Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv .build/arm64-apple-macosx/release/xcbeautify.zip "xcbeautify-${{ env.TAG }}-arm64-apple-macosx.zip"
          gh release upload "${{ env.TAG }}" "xcbeautify-${{ env.TAG }}-arm64-apple-macosx.zip" --clobber

  ubuntu_x86_64:
    name: Release Linux x86_64
    runs-on: ubuntu-22.04
    needs: create_release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Swift ${{ env.SWIFT_VERSION }}
        run: wget https://download.swift.org/swift-${{ env.SWIFT_VERSION }}-release/ubuntu2204/swift-${{ env.SWIFT_VERSION }}-RELEASE/swift-${{ env.SWIFT_VERSION }}-RELEASE-ubuntu22.04.tar.gz
      - name: Extract Swift ${{ env.SWIFT_VERSION }}
        run: tar xzf swift-${{ env.SWIFT_VERSION }}-RELEASE-ubuntu22.04.tar.gz
      - name: Add Swift toolchain to PATH
        run: echo "$GITHUB_WORKSPACE/swift-${{ env.SWIFT_VERSION }}-RELEASE-ubuntu22.04/usr/bin" >> $GITHUB_PATH
      - name: Package Linux x86_64
        run: make package-linux-x86_64
      - name: Upload Linux x86_64 Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv xcbeautify.tar.xz "xcbeautify-${{ env.TAG }}-x86_64-unknown-linux-gnu.tar.xz"
          gh release upload "${{ env.TAG }}" "xcbeautify-${{ env.TAG }}-x86_64-unknown-linux-gnu.tar.xz" --clobber

  ubuntu_x86_64_static:
    name: Release Linux x86_64 Static
    runs-on: ubuntu-22.04
    needs: create_release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Swift ${{ env.SWIFT_VERSION }}
        run: wget https://download.swift.org/swift-${{ env.SWIFT_VERSION }}-release/ubuntu2204/swift-${{ env.SWIFT_VERSION }}-RELEASE/swift-${{ env.SWIFT_VERSION }}-RELEASE-ubuntu22.04.tar.gz
      - name: Extract Swift ${{ env.SWIFT_VERSION }}
        run: tar xzf swift-${{ env.SWIFT_VERSION }}-RELEASE-ubuntu22.04.tar.gz
      - name: Add Swift toolchain to PATH
        run: echo "$GITHUB_WORKSPACE/swift-${{ env.SWIFT_VERSION }}-RELEASE-ubuntu22.04/usr/bin" >> $GITHUB_PATH
      - name: Install Swift Static Linux SDK
        run: swift sdk install "${{ env.SWIFT_STATIC_SDK_URL }}" --checksum "${{ env.SWIFT_STATIC_SDK_CHECKSUM }}"
      - name: Package Linux x86_64 Static
        run: make package-linux-x86_64-static
      - name: Store Linux x86_64 Static Binary for Artifact Bundle
        uses: actions/upload-artifact@v4
        with:
          name: xcbeautify-linux-x86_64-static
          path: xcbeautify.tar.xz
          if-no-files-found: error
      - name: Upload Linux x86_64 Static Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv xcbeautify.tar.xz "xcbeautify-${{ env.TAG }}-x86_64-linux-static.tar.xz"
          gh release upload "${{ env.TAG }}" "xcbeautify-${{ env.TAG }}-x86_64-linux-static.tar.xz" --clobber

  artifactbundle:
    name: Release Artifact Bundle
    runs-on: ubuntu-latest
    needs: [macos, ubuntu_x86_64_static]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Darwin Universal Binary
        uses: actions/download-artifact@v4
        with:
          name: xcbeautify-macos
          path: binaries/macos
      - name: Download Linux x86_64 Static Binary
        uses: actions/download-artifact@v4
        with:
          name: xcbeautify-linux-x86_64-static
          path: binaries/linux-x86_64
      - name: Extract Linux x86_64 Static Binary
        run: tar --directory binaries/linux-x86_64 --extract --xz --file binaries/linux-x86_64/xcbeautify.tar.xz
      - name: Create Artifact Bundle
        id: bundle
        run: |
          checksum=$(tools/create-artifactbundle "${{ env.TAG }}" "xcbeautify-${{ env.TAG }}.artifactbundle.zip" \
            --macos binaries/macos/xcbeautify \
            --linux-x86_64 binaries/linux-x86_64/xcbeautify)
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
      - name: Upload Artifact Bundle Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.TAG }}" "xcbeautify-${{ env.TAG }}.artifactbundle.zip" --clobber
      - name: Add Artifact Bundle Checksum to Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKSUM: ${{ steps.bundle.outputs.checksum }}
        run: |
          gh release view "${{ env.TAG }}" --json body --jq .body > notes.md
          cat >> notes.md <<EOF

          ## Swift Package Manager Artifact Bundle

          \`\`\`swift
          .binaryTarget(
              name: "xcbeautify",
              url: "https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/xcbeautify-${{ env.TAG }}.artifactbundle.zip",
              checksum: "${CHECKSUM}"
          )
          \`\`\`
          EOF
          gh release edit "${{ env.TAG }}" --notes-file notes.md
